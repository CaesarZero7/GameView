<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css" />
    <title>Вход и регистрация | GameView</title>
  </head>

  <body>
    <a href="../index.html" class="back-button">
      <i class="fas fa-arrow-left"></i>
      На главную
    </a>
    
    <div class="container" id="container">
      <div class="form-container sign-in">
        <form>
          <p>Авторизация</p>
          <div class="social-icons">
            <a href="#" class="icon" title="Войти через Google">
              <i class="fa-brands fa-google"></i>
            </a>
            <a href="#" class="icon" title="Войти через Facebook">
              <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="icon" title="Войти через GitHub">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="icon" title="Войти через LinkedIn">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
          </div>
          <span>или используйте email и пароль</span>
          <input type="email" placeholder="Email" required />
          <input type="password" placeholder="Пароль" required />
          <a href="#" class="forgot-password">Забыли пароль?</a>
          <button type="submit">Войти</button>
        </form>
      </div>
      
      <div class="form-container sign-up">
        <form>
          <p>Регистрация</p>
          <div class="social-icons">
            <a href="#" class="icon" title="Зарегистрироваться через Google">
              <i class="fa-brands fa-google"></i>
            </a>
            <a href="#" class="icon" title="Зарегистрироваться через Facebook">
              <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="icon" title="Зарегистрироваться через GitHub">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="icon" title="Зарегистрироваться через LinkedIn">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
          </div>
          <span>или используйте email для регистрации</span>
          <input type="text" placeholder="Имя" required />
          <input type="email" placeholder="Email" required />
          <input type="password" placeholder="Пароль" required />
          <button type="submit">Зарегистрироваться</button>
        </form>
      </div>
      
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <p>Добро пожаловать!</p>
            <p>Введите ваши данные для входа в аккаунт</p>
            <button class="hidden" id="login">Войти</button>
          </div>
          <div class="toggle-panel toggle-right">
            <p>Привет, друг!</p>
            <p>
              Зарегистрируйтесь с вашими данными для доступа ко всем функциям сайта
            </p>
            <button class="hidden" id="register">Зарегистрироваться</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
